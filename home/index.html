<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAW HABA - Natural Energy Activation Shot</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
    color:#fff;
}

.container{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.hero{
    width:100%;
    max-width:1000px;
    position:relative;
}

.hero img{
    width:100%;
    display:block;
    border-radius:12px;
}

.buy-button{
    position:absolute;
    bottom:40px;
    right:40px;
    text-decoration:none;
    background:#ff2b2b;
    color:white;
    padding:18px 36px;
    font-size:22px;
    font-weight:bold;
    border-radius:10px;
    transition:.3s;
    box-shadow:0 0 20px rgba(255,43,43,.4);
}

.buy-button:hover{
    background:#ff4a4a;
    transform:scale(1.05);
}

.mobile-button{
    display:none;
}

.footer{
    margin-top:30px;
    text-align:center;
}

.footer h2{
    color:#ff2b2b;
    margin-bottom:10px;
    font-size:42px;
}

.footer p{
    color:#ccc;
    font-size:20px;
}

@media(max-width:768px){

    .buy-button{
        display:none;
    }

    .mobile-button{
        display:inline-block;
        margin-top:20px;
        text-decoration:none;
        background:#ff2b2b;
        color:white;
        padding:18px 32px;
        border-radius:10px;
        font-size:20px;
        font-weight:bold;
    }

    .footer h2{
        font-size:32px;
    }

    .footer p{
        font-size:18px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="hero">

        <img src=Images/IMG_9656.png alt="RAW HABA">

        <a
            href="YOUR_ETSY_LINK_HERE"
            target="_blank"
            class="buy-button">
            BUY NOW
        </a>

    </div>

    <a
        href="YOUR_ETSY_LINK_HERE"
        target="_blank"
        class="mobile-button">
        BUY NOW
    </a>

    <div class="footer">
        <h2>RAW HABA</h2>
        <p>Natural Energy Activation Shot</p>
    </div>

</div>

</body>
</html>
