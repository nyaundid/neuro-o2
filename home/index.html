<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAW HABA - Natural Energy Activation Shot</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.hero{
    width:100%;
    max-width:900px;
    text-align:center;
}

.hero img{
    width:100%;
    height:auto;
    display:block;
    border-radius:12px;
}

.buy-button{
    display:inline-block;
    margin-top:20px;
    background:#ff2b2b;
    color:#fff;
    text-decoration:none;
    padding:16px 32px;
    border-radius:10px;
    font-size:22px;
    font-weight:bold;
    transition:.3s;
}

.buy-button:hover{
    transform:scale(1.05);
}

.footer{
    margin-top:25px;
    text-align:center;
}

.footer h2{
    font-size:42px;
    color:#ff2b2b;
    margin-bottom:10px;
}

.footer p{
    font-size:20px;
    color:#ccc;
}

@media(max-width:768px){

    .footer h2{
        font-size:30px;
    }

    .footer p{
        font-size:18px;
    }

    .buy-button{
        width:100%;
        max-width:300px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="hero">

        <!-- CHANGE THIS PATH IF NEEDED -->
        <img src="/images/haba.png" alt="RAW HABA">

        <a
            href="https://www.etsy.com"
            target="_blank"
            class="buy-button">
            BUY NOW
        </a>

    </div>

    <div class="footer">
        <h2>RAW HABA</h2>
        <p>Natural Energy Activation Shot</p>
    </div>

</div>

</body>
</html>
